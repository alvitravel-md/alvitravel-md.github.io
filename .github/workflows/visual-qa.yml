name: AlviTravel Visual QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.html'
      - 'blog/**'
      - 'styles.css'
      - 'premium-refresh.css'
      - 'premium-refresh.js'
      - 'script.js'
      - 'contact-hub-polish.css'
      - 'tests/visual-qa.cjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.24.1
      - name: Start site locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/alvi-local-server.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8765/ > /dev/null
      - name: Run visual and responsive QA
        run: node tests/visual-qa.cjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alvitravel-visual-qa
          path: qa-screens/
          retention-days: 3
